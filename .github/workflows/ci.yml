name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Rails ${{ matrix.rails }} (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # One row per supported Rails, on the latest Ruby that Rails can use.
        include:
          - { ruby: '2.7', rails: '5.2', postgres: '16' }
          - { ruby: '2.7', rails: '6.0', postgres: '16' }
          - { ruby: '3.1', rails: '6.1', postgres: '16' }
          - { ruby: '3.3', rails: '7.0', postgres: '16' }
          - { ruby: '3.3', rails: '7.1', postgres: '16' }
          - { ruby: '3.4', rails: '7.2', postgres: '16' }
          - { ruby: '3.4', rails: '8.0', postgres: '16' }
          - { ruby: '3.4', rails: '8.1', postgres: '16' }

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: active_record-mti-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: gemfiles/activerecord-${{ matrix.rails }}.Gemfile
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/active_record-mti-test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec --format documentation
