name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Rails ${{ matrix.rails }} (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # One row per supported Rails, on the latest Ruby that Rails can use.
        include:
          - { ruby: '2.7', rails: '5.2', postgres: '16' }
          - { ruby: '2.7', rails: '6.0', postgres: '16' }
          - { ruby: '3.1', rails: '6.1', postgres: '16' }
          - { ruby: '3.3', rails: '7.0', postgres: '16' }
          - { ruby: '3.3', rails: '7.1', postgres: '16' }
          - { ruby: '3.4', rails: '7.2', postgres: '16' }
          - { ruby: '3.4', rails: '8.0', postgres: '16' }
          - { ruby: '3.4', rails: '8.1', postgres: '16' }

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: active_record-mti-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: gemfiles/activerecord-${{ matrix.rails }}.Gemfile
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/active_record-mti-test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec --format documentation

      - name: Upload coverage artifact (Rails 8.1 / Ruby 3.4 only)
        if: matrix.rails == '8.1' && matrix.ruby == '3.4'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  coverage:
    name: Coverage & quality
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@v1
        continue-on-error: true
        env:
          QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        with:
          oidc: true
          files: coverage/.resultset.json

      - name: Run Qlty code quality checks
        run: |
          curl -sSfL https://qlty.sh | sh
          echo "$HOME/.qlty/bin" >> "$GITHUB_PATH"
          ~/.qlty/bin/qlty check || true
        continue-on-error: true
