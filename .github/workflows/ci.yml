name: CI

on:
  push:
    branches: [main, develop, overhaul]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3']
        rails: ['5.2', '6.0', '6.1', '7.0', '7.1', '7.2']
        postgres: ['15', '16', '17']
        exclude:
          # Rails 5.2 requires Ruby < 3.1
          - ruby: '3.1'
            rails: '5.2'
          - ruby: '3.2'
            rails: '5.2'
          - ruby: '3.3'
            rails: '5.2'
          # Rails 6.0 requires Ruby < 3.1
          - ruby: '3.1'
            rails: '6.0'
          - ruby: '3.2'
            rails: '6.0'
          - ruby: '3.3'
            rails: '6.0'
          # Only test PG 15 and 17 to reduce matrix size
          - postgres: '16'
        include:
          # Ensure at least one PG 16 run
          - ruby: '3.2'
            rails: '7.1'
            postgres: '16'

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: active_record-mti-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: gemfiles/activerecord-${{ matrix.rails }}.Gemfile
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/active_record-mti-test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec --format documentation
